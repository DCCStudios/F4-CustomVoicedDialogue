[General]
; Voice the player's dialogue lines when they have no recorded voice file.
bEnablePlayerLines=1
; Voice NPC dialogue lines that have no recorded voice file. Off by default.
bEnableNPCLines=0
; Replace the player's lines with TTS even when they HAVE recorded audio
; (a custom player voice instead of the vanilla voice actors). Lines whose
; TTS audio is not generated yet play silence, so expect quiet lines on a
; first encounter until prefetch/replay fills the cache. Makes mods like
; Silent Protagonist unnecessary.
bReplaceVoicedPlayerLines=0
; Same, for NPCs (also needs bEnableNPCLines=1). Re-voices every NPC line
; through TTS - only useful for full re-voicing setups.
bReplaceVoicedNPCLines=0
; Force subtitles on for lines this plugin silenced or replaced with TTS.
bForceSubtitles=1
; Log every dialogue line the hook observes (text, engine voice path, voice type).
; Useful for diagnostics and for building the voice-path validation corpus.
bVerboseLog=0
; Comma-separated voice type editor IDs treated as the player.
sPlayerVoiceTypes=PlayerVoiceMale01,PlayerVoiceFemale01
; Volume applied to TTS audio as it is generated (percent, 0-150).
; Also adjustable in-game via the F4SE Menu Framework settings page.
; Only affects newly generated lines; above 100 loud voices may clip.
iTtsVolumePercent=100
; Always play generated player lines through the generic audio channel
; (the HerikaServer approach) instead of the engine's voice file system.
; Silence files carry the dialogue timing. Try this if generated lines
; stay silent on your setup.
bDirectAudioPlayback=0
; Play freshly generated lines through the game's own audio system, so they
; get 3D positioning, the game's volume sliders and normal mixing/ducking.
; The game only indexes loose files at startup, so this works by copying the
; new audio into one of the Stream_NN.wav slot files that shipped with the
; mod (already indexed). If the engine cannot be shown to be playing exactly
; what was written, playback falls back to direct Win32 audio automatically.
; Set to 0 to always use the Win32 path.
bEngineAudioForFreshLines=1
; Show a small corner progress bar while a conversation's TTS generates
; (requires F4SE Menu Framework).
bShowGenerationProgress=1

[Server]
; The CustomVoicedDialogue companion app must listen on this address.
; Both sides default to 127.0.0.1:47600; change them together.
sHost=127.0.0.1
iPort=47600
; Per-request timeout for talking to the companion server.
iRequestTimeoutMs=5000
; How often to re-check an unreachable server (seconds).
iServerRetrySeconds=30

[Silence]
; While TTS audio for a line is not ready yet, the line plays a silence file
; sized from its word count so the subtitle stays up long enough to read.
uWordsPerSecond=2
uMinimumSeconds=1
; Wide (multi-byte) characters counted as one word per this many characters.
uWideCharactersPerWord=3
; Extra seconds a picked line is held open while its voice is still
; generating, so the audio can arrive and play instead of the conversation
; advancing over a silent line (bounded wait-for-voice; 0 = never wait).
; Also adjustable in-game via the F4SE Menu Framework settings page.
uPendingLineWaitSeconds=3

[Prefetch]
; When the dialogue menu opens, send the visible player options to the server
; so their audio is ready before an option is selected.
bEnablePrefetch=1
; Poll interval for pending synthesis results while the dialogue menu is open.
iMenuPollMs=500
; Poll interval outside of dialogue.
iIdlePollMs=3000
; Look-ahead prefetch: how long (milliseconds) the crosshair must rest on a
; living, non-hostile NPC in talking range before that NPC's dialogue starts
; generating, so their lines are ready before you press the talk key. Only
; the scenes that NPC is actually cast in are queued. Raise this if you are
; generating lines for NPCs you never end up talking to (cloud TTS costs);
; 0 disables look-ahead prefetch entirely.
iLookPrefetchMs=2000
